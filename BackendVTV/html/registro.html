<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro - Fitness App</title>
  <!-- Framework Bulma CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
  <link rel="stylesheet" href="../css/evaluacion.css">
  <link rel="stylesheet" href="../css/alertas.css">
  <link rel="stylesheet" href="../css/registro.css">
</head>
<body class="py-6 px-4">

  <div class="container" style="max-width: 500px;">
    <div class="box glass-box">
      
      <div class="has-text-centered mb-5">
        <h1 class="title is-3 mb-2">Crear Cuenta</h1>
        <p class="subtitle is-6 has-text-grey-light">Regístrate para comenzar tu plan personalizado</p>
      </div>

      <!-- Formulario con novalidate para delegar la validación a JS -->
      <form id="registroForm" novalidate>
        
        <!-- Nombre Completo -->
        <div class="field mb-4">
          <label class="label is-small">NOMBRE COMPLETO</label>
          <div class="control">
            <input class="input" id="regNombre" type="text" placeholder="Ej. Juan Pérez">
          </div>
        </div>

        <!-- Correo Electrónico -->
        <div class="field mb-4">
          <label class="label is-small">CORREO ELECTRÓNICO</label>
          <div class="control">
            <input class="input" id="regCorreo" type="email" placeholder="ejemplo@correo.com">
          </div>
        </div>

        <!-- Contraseña -->
        <div class="field mb-4">
          <label class="label is-small">CONTRASEÑA</label>
          <div class="control">
            <input class="input" id="regPassword" type="password" placeholder="Mínimo 6 caracteres">
          </div>
        </div>

        <!-- Confirmar Contraseña -->
        <div class="field mb-5">
          <label class="label is-small">CONFIRMAR CONTRASEÑA</label>
          <div class="control">
            <input class="input" id="regPasswordConfirm" type="password" placeholder="Repite tu contraseña">
          </div>
        </div>

        <!-- Botón de Envío -->
        <div class="field mt-5">
          <div class="control">
            <button type="submit" class="button btn-submit is-fullwidth is-medium">
              Registrarme
            </button>
          </div>
        </div>

        <p class="has-text-centered is-size-7 mt-4">
          ¿Ya tienes cuenta? <a href="login.html" class="has-text-white" style="text-decoration: underline;">Inicia sesión aquí</a>
        </p>

      </form>

    </div>
  </div>

  <script src="../js/registro.js"></script>
  <script src="../js/alertas.js"></script>
</body>
</html>
