<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Perfil - Fitness App</title>
  <!-- Framework Bulma CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
  <!-- Iconos FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.net/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Hoja de Estilos Separada -->
  <link rel="stylesheet" href="../css/perfil.css">
</head>
<body class="py-6 px-4">

  <div class="container" style="max-width: 700px;">

    <!-- Tarjeta Principal del Perfil -->
    <div class="box glass-box p-5">
      
      <!-- Encabezado del Perfil -->
        <h1 id="perfilNombre" class="title is-3 mb-1">Cargando Nombre...</h1>
        <p id="perfilCorreo" class="subtitle is-6 has-text-grey-light mb-0">cargando_correo@email.com</p>
      </div>

      <hr class="glass-divider">

      <!-- Métricas y Resultados Fisiológicos -->
      <h2 class="title is-5 mb-4"><i class="fas fa-heartbeat mr-2" style="color: #f87171;"></i>Evaluación Físico-Nutricional</h2>
      
      <div class="columns is-multiline mb-4">
        <!-- IMC -->
        <div class="column is-6">
          <div class="p-3 metric-card-main">
            <span class="is-size-7 has-text-grey-light is-block">ÍNDICE DE MASA CORPORAL (IMC)</span>
            <strong id="perfilIMC" class="is-size-4 has-text-white">--</strong>
            <span id="perfilEstadoIMC" class="tag is-info is-light is-rounded ml-2">Sin calcular</span>
          </div>
        </div>

        <!-- Objetivo -->
        <div class="column is-6">
          <div class="p-3 metric-card-main">
            <span class="is-size-7 has-text-grey-light is-block">OBJETIVO PRINCIPAL</span>
            <strong id="perfilObjetivo" class="is-size-5 has-text-white">--</strong>
          </div>
        </div>

        <!-- Edad -->
        <div class="column is-4">
          <div class="p-3 metric-card-sub">
            <span class="is-size-7 has-text-grey-light is-block">EDAD</span>
            <strong id="perfilEdad" class="is-size-6 has-text-white">-- años</strong>
          </div>
        </div>

        <!-- Peso -->
        <div class="column is-4">
          <div class="p-3 metric-card-sub">
            <span class="is-size-7 has-text-grey-light is-block">PESO ACTUAL</span>
            <strong id="perfilPeso" class="is-size-6 has-text-white">-- kg</strong>
          </div>
        </div>

        <!-- Altura -->
        <div class="column is-4">
          <div class="p-3 metric-card-sub">
            <span class="is-size-7 has-text-grey-light is-block">ALTURA</span>
            <strong id="perfilAltura" class="is-size-6 has-text-white">-- cm</strong>
          </div>
        </div>
      </div>

      <!-- Acciones de Cuenta -->
      <div class="buttons is-centered mt-5">
        <a href="evaluacion.html" class="button is-warning is-outlined is-rounded">
          <span class="icon"><i class="fas fa-edit"></i></span>
          <span>Actualizar Valoración</span>
        </a>
        <button id="btnCerrarSesion" class="button is-danger is-light is-rounded">
          <span class="icon"><i class="fas fa-sign-out-alt"></i></span>
          <span>Cerrar Sesión</span>
        </button>
      </div>

    </div>

  </div>

    <div class="mb-4">
      <a href="paginaP.html" class="button is-light is-outlined is-rounded">
        <span class="icon"><i class="fas fa-arrow-left"></i></span>
        <span>Volver al Inicio</span>
      </a>
    </div>

  <script src="../js/perfil.js"></script>
</body>
</html>
