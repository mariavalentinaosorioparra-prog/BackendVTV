<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Banco de Alimentos - Admin</title>

  <!-- Framework Bulma CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
  <!-- Iconos FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../css/plan_nutricional.css">
  <link rel="stylesheet" href="../css/alertas.css">
  <link rel="stylesheet" href="../css/asignaciones.css">

  <!-- Visor 3D (para vista previa de archivos .glb / .gltf) -->
  <script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>

  <style>
    /* Zona de carga 3D */
    .media-upload-zone {
      border: 2px dashed #4b5563;
      border-radius: 12px;
      padding: 1.5rem;
      text-align: center;
      transition: border-color .2s, background .2s;
    }
    .media-upload-zone.is-dragover {
      border-color: #60a5fa;
      background: rgba(96, 165, 250, .1);
    }
    .media-preview-placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: .5rem;
      margin-top: 1rem;
      min-height: 120px;
    }
    .media-preview-placeholder img {
      max-height: 240px;
      max-width: 100%;
      border-radius: 8px;
    }
    .media-preview-placeholder model-viewer {
      width: 100%;
      height: 260px;
      border-radius: 8px;
    }
    .upload-error {
      color: #f87171;
      font-size: .8rem;
      margin-top: .5rem;
      min-height: 1.2em;
    }
    .form-message {
      margin-top: 1rem;
      padding: .75rem 1rem;
      border-radius: 8px;
      font-size: .9rem;
    }
    .form-message.is-ok    { background: rgba(34, 197, 94, .15);  color: #4ade80; }
    .form-message.is-error { background: rgba(248, 113, 113, .15); color: #f87171; }
    .form-message[hidden]  { display: none; }
  </style>
</head>
<body class="py-6 px-4">

  <div class="container" style="max-width: 800px;">

    <div class="mb-4">
      <a href="adm.html" class="button is-light is-outlined is-rounded">
        <span class="icon"><i class="fas fa-arrow-left"></i></span>
        <span>Volver al Panel</span>
      </a>
    </div>

    <div class="box glass-box">
      <div class="mb-5">
        <h1 class="title is-3">Banco de Alimentos y Platos (Admin)</h1>
        <p class="subtitle is-6 has-text-grey-light">
          Registra platillos para ser asignados según el IMC y objetivo del usuario
        </p>
      </div>

      <form id="formPlato" action="#" method="POST" enctype="multipart/form-data" novalidate>

        <!-- Nombre del plato -->
        <div class="field mb-4">
          <label class="label is-small" for="nombre">NOMBRE DEL PLATO / ALIMENTO</label>
          <div class="control">
            <input class="input" id="nombre" name="nombre" type="text"
                   placeholder="Ej. Pechuga a la plancha con quinoa y aguacate" required>
          </div>
        </div>

        <!-- Categoría y Calorías -->
        <div class="columns">
          <div class="column is-6">
            <div class="field mb-4">
              <label class="label is-small" for="categoria">CATEGORÍA</label>
              <div class="control">
                <div class="select is-fullwidth">
                  <select id="categoria" name="categoria" required>
                    <option value="" disabled selected>Selecciona categoría...</option>
                    <option value="desayuno">Desayuno</option>
                    <option value="almuerzo">Almuerzo</option>
                    <option value="cena">Cena</option>
                    <option value="snack">Snack / Colación</option>
                  </select>
                </div>
              </div>
            </div>
          </div>

          <div class="column is-6">
            <div class="field mb-4">
              <label class="label is-small" for="calorias">CALORÍAS TOTALES (KCAL)</label>
              <div class="control">
                <input class="input" id="calorias" name="calorias" type="number"
                       min="0" placeholder="Ej. 550" required>
              </div>
            </div>
          </div>
        </div>

        <!-- Macros -->
        <div class="columns">
          <div class="column is-4">
            <div class="field mb-4">
              <label class="label is-small" for="proteinas">PROTEÍNAS (G)</label>
              <input class="input" id="proteinas" name="proteinas" type="number"
                     step="0.1" min="0" placeholder="Ej. 40">
            </div>
          </div>
          <div class="column is-4">
            <div class="field mb-4">
              <label class="label is-small" for="carbohidratos">CARBOHIDRATOS (G)</label>
              <input class="input" id="carbohidratos" name="carbohidratos" type="number"
                     step="0.1" min="0" placeholder="Ej. 50">
            </div>
          </div>
          <div class="column is-4">
            <div class="field mb-4">
              <label class="label is-small" for="grasas">GRASAS (G)</label>
              <input class="input" id="grasas" name="grasas" type="number"
                     step="0.1" min="0" placeholder="Ej. 15">
            </div>
          </div>
        </div>

        <!-- Filtros de Asignación por IMC y Objetivo -->
        <div class="columns mb-4">
          <div class="column is-6">
            <label class="label is-small">APTO PARA IMC</label>
            <div class="field">
              <label class="checkbox mr-3"><input type="checkbox" name="imc" value="bajo_peso"> Bajo peso (&lt;18.5)</label><br>
              <label class="checkbox mr-3"><input type="checkbox" name="imc" value="normal"> Normal (18.5 - 24.9)</label><br>
              <label class="checkbox mr-3"><input type="checkbox" name="imc" value="sobrepeso"> Sobrepeso (25 - 29.9)</label><br>
              <label class="checkbox"><input type="checkbox" name="imc" value="obesidad"> Obesidad (≥30)</label>
            </div>
          </div>
          <div class="column is-6">
            <label class="label is-small">OBJETIVOS COMPATIBLES</label>
            <div class="field">
              <label class="checkbox mr-3"><input type="checkbox" name="objetivos" value="perder_peso"> Perder peso</label><br>
              <label class="checkbox mr-3"><input type="checkbox" name="objetivos" value="ganar_peso"> Ganar peso</label><br>
              <label class="checkbox mr-3"><input type="checkbox" name="objetivos" value="ganar_musculo"> Ganar masa muscular</label><br>
              <label class="checkbox"><input type="checkbox" name="objetivos" value="mantener_peso"> Mantener peso</label>
            </div>
          </div>
        </div>

        <!-- Carga y vista previa del modelo 3D del plato -->
        <div class="field mb-5">
          <label class="label is-small">MODELO / IMAGEN 3D DEL PLATO</label>

          <div class="media-upload-zone" id="zonaCarga">
            <i class="fas fa-cube fa-2x mb-2" style="color: #60a5fa;"></i>
            <p class="is-size-7 has-text-grey-light">
              Arrastra aquí el archivo 3D (.glb, .gltf, .obj) o una imagen (máx. 25 MB)
            </p>

            <!-- Sin atributo accept: los navegadores bloquean .glb/.obj con accept -->
            <div class="file is-centered is-small mt-3">
              <label class="file-label">
                <input class="file-input" type="file" name="modelo_3d" id="modelo3d">
                <span class="file-cta">
                  <span class="file-icon"><i class="fas fa-upload"></i></span>
                  <span class="file-label">Cargar Archivo 3D</span>
                </span>
              </label>
            </div>

            <p class="upload-error" id="errorCarga" role="alert"></p>

            <!-- Previsualización -->
            <div class="media-preview-placeholder" id="previewCarga">
              <i class="fas fa-box-open fa-2x mb-2" style="color: #4b5563;"></i>
              <span class="is-size-7 has-text-grey">Vista previa del objeto 3D interactivo</span>
            </div>

            <button type="button" class="button is-small is-light mt-3" id="btnQuitar" hidden>
              Quitar archivo
            </button>
          </div>
        </div>

        <button type="submit" class="button btn-submit is-fullwidth">Guardar Plato en el Banco Nutricional</button>

        <div class="form-message" id="mensajeForm" role="status" hidden></div>
      </form>
    </div>

    <!-- Botón Volver (queda debajo de la lista que agrega admin_bancos.js) -->
    <div class="mt-5">
      <a href="adm.html" class="button is-light is-outlined is-rounded">
        <span class="icon"><i class="fas fa-arrow-left"></i></span>
        <span>Volver al Panel</span>
      </a>
    </div>

  </div>

  <script src="../js/datos.js"></script>
  <script src="../js/asignacion.js"></script>
  <script src="../js/alertas.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/admin_bancos.js"></script>
  <script src="../js/carga3d.js"></script>
</body>
</html>
