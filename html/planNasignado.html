<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plan Nutricional - Fitness App</title>
  <!-- Framework Bulma CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
  <!-- Iconos de FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Alertas globales y CSS exclusivo de nutrición -->
  <link rel="stylesheet" href="../css/alertas.css">
  <link rel="stylesheet" href="../css/planNasignado.css">
</head>
<body class="nutricion-page py-6 px-4">

  <div class="container" style="max-width: 900px;">

    <!-- Encabezado -->
    <div class="box glass-box mb-5 p-4">
      <div class="level is-mobile">
        <div class="level-left">
          <h1 class="title is-4 has-text-white mb-0">
            <i class="fas fa-utensils mr-2" style="color: #4ade80;"></i>Tu Plan Nutricional
          </h1>
        </div>
        <div class="level-right">
          <a href="paginaP.html" class="button is-light is-small is-rounded">
            <span class="icon"><i class="fas fa-arrow-left"></i></span>
            <span>Volver al inicio</span>
          </a>
        </div>
      </div>
    </div>

    <!-- Resumen de Calorías -->
    <div class="box glass-box mb-5 p-5 has-text-centered">
      <h3 class="subtitle is-6 has-text-grey-light mb-1">Calorías Diarias Objetivo</h3>
      <p id="kcalObjetivo" class="title is-2 has-text-success">2000 kcal</p>
    </div>

    <!-- Contenedor Dinámico de Alimentos / Platos Asignados -->
    <div class="box glass-box p-5">
      <h3 class="title is-5 has-text-white mb-4">
        <i class="fas fa-plate-wheat mr-2"></i>Alimentos Recomendados para ti
      </h3>
      <div id="contenedorAlimentos" class="content">
        <!-- Se llenará dinámicamente con JavaScript -->
      </div>
    </div>

  </div>

  <!-- Scripts -->
  <script src="../js/alertas.js"></script>
  <script src="../js/planNasignado.js"></script>
</body>
</html>
