<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Valoración Inicial - Fitness</title>
  <!-- Framework Bulma CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
  <link rel="stylesheet" href="../css/evaluacion.css">
</head>
<body class="py-6 px-4">

  <div class="container" style="max-width: 600px;">

    <!-- Tarjeta Principal del Formulario -->
    <div class="box glass-box">
      
      <!-- Encabezado -->
      <div class="has-text-centered mb-5">
        <h1 class="title is-3 mb-2" style="line-height: 1.2;">Valoración Inicial</h1>
        <p class="subtitle is-6 has-text-grey-light" style="line-height: 1.2;">
          Ingresa tus datos para calcular tus requerimientos y estructurar tu plan
        </p>
      </div>

      <!-- Formulario de Entrada del Usuario -->
      <form id="evaluacionForm">
        
        <!-- Fecha de Nacimiento -->
        <div class="field mb-4">
          <label class="label is-small">FECHA DE NACIMIENTO</label>
          <div class="control">
            <input class="input" type="date" required>
          </div>
        </div>

        <!-- Peso y Altura -->
        <div class="columns is-mobile">
          <div class="column is-6">
            <div class="field mb-4">
              <label class="label is-small">PESO (KG)</label>
              <div class="control">
                <input class="input" type="number" step="0.1" placeholder="Ej. 70.5" required>
              </div>
            </div>
          </div>

          <div class="column is-6">
            <div class="field mb-4">
              <label class="label is-small">ALTURA (CM)</label>
              <div class="control">
                <input class="input" type="number" placeholder="Ej. 175" required>
              </div>
            </div>
          </div>
        </div>

        <!-- Objetivo Principal -->
        <div class="field mb-5">
          <label class="label is-small">OBJETIVO PRINCIPAL</label>
          <div class="control">
            <div class="select is-fullwidth">
              <select required>
                <option value="" disabled selected>Selecciona tu objetivo...</option>
                <option value="perder_peso">Perder peso</option>
                <option value="ganar_peso">Ganar peso</option>
                <option value="ganar_masa_muscular">Ganar masa muscular</option>
                <option value="mantener_peso">Mantener peso</option>
              </select>
            </div>
          </div>
        </div>

        <!-- Botón de Envío -->
        <div class="field mt-5">
          <div class="control">
            <button type="submit" class="button btn-submit is-fullwidth is-medium">
              Generar Mi Rutina y Plan Nutricional
            </button>
          </div>
        </div>

      </form>

    </div>
  </div>

<script src="../js/evaluacion.js"></script>
  
</body>
</html>
